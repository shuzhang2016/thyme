name: Runner limits

on: push

jobs:
  limits:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Report limits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Runner limits for ${GITHUB_SHA}"
            echo
            echo '```'
            ulimit -a
            echo
            for f in memory.max memory.current memory.events memory.swap.max \
                     pids.max pids.current cpu.max; do
              echo "$f: $(cat /sys/fs/cgroup/system.slice/hosted-compute-agent.service/$f 2>/dev/null || echo n/a)"
            done
            echo
            echo "cgroup: $(cat /proc/self/cgroup)"
            echo "nproc: $(nproc)"
            echo "max_map_count: $(cat /proc/sys/vm/max_map_count 2>/dev/null || echo n/a)"
            echo "threads-max: $(cat /proc/sys/kernel/threads-max 2>/dev/null || echo n/a)"
            echo "pid_max: $(cat /proc/sys/kernel/pid_max 2>/dev/null || echo n/a)"
            echo "file-max: $(cat /proc/sys/fs/file-max 2>/dev/null || echo n/a)"
            free -m
            df -h
            echo '```'
          } > /tmp/limits.md
          gh issue create --title "Runner limits ${GITHUB_SHA::7}" --body-file /tmp/limits.md
