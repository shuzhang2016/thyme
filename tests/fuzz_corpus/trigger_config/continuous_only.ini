# Continuous-only recorder config: no [source.*], exempt from the
# empty-topology error because auto_arm = true.
[trigger_center]
socket = /tmp/thyme_trigger.sock
max_concurrent_captures = 1

[channel./thyme_recr_can]
kind = mirror_ring
name = can_chassis
rate_hz = 50
avg_frame_bytes = 128

[continuous]
auto_arm = true
channels = small_struct:*
slice_mb = 512
slice_s = 0
wait_idle = false
rate_check = warn
