# Minimal deployable trigger_center configuration (TRG-17/TRG-18).
# Validate with:
#   trigger_center --check-config --record-manifest /etc/thyme/record_manifest.h \
#     tools/apps/trigger_center/trigger_config.minimal.ini

[trigger_center]
socket = /tmp/thyme_trigger.sock
max_concurrent_captures = 1
tick_ms = 1
socket_poll_budget_us = 200
max_trigger_rate_hz = 10000
dedup_window_entries = 1024
dedup_window_ms = 60000
# Preserve one-hour quotas across center restart. State I/O is fail-closed.
quota_state = /var/lib/thyme/trigger-quota.bin
default_source = manual
crash_priority = 100

[recorder]
output_dir = /opt/usr/triggered_data
pending_bytes_quota = 67108864
flush_policy = idle
disk_quota_mb = 20000

# SEC-02: effective defaults shown explicitly. The empty allowlist accepts
# only the center's own euid (single-user dev box); pin uids in production:
#   allowed_uids = 1000,1001
#   audit_log = /var/log/thyme/trigger.audit
[security]
allow_root = false
require_peer_pid = true
max_priority_hint = 1000
allow_legacy_unsequenced = false
allow_legacy_v2 = false
allow_legacy_control = false
# control_audit_log = /var/log/thyme/recorder-control.audit
audit_max_bytes = 4194304
audit_rotate_keep = 2
audit_fsync_interval_s = 0

[logging]
service_file = /var/log/thyme/trigger-center.log
service_max_bytes = 8388608
service_rotate_keep = 2

[channel./h264_front]
kind = h264_stream
name = h264_front
bitrate_kbps = 4000

[channel./thyme_recr_can]
kind = mirror_ring
name = can_chassis
record_channels = can_chassis
rate_hz = 50
avg_frame_bytes = 128

[source.manual]
channels = h264_front, can_chassis
before_s = 10
after_s = 5
priority = 10
mute_s = 0
quota_class = manual

[source.crash]
channels = h264_front, can_chassis
before_s = 10
after_s = 5
priority = 100
mute_s = 0
flush_policy = realtime
quota_class = safety

[quota.manual]
max_triggers_per_hour = 10

[quota.safety]
max_triggers_per_hour = 0

[continuous]
auto_arm = false
channels = small_struct:*
slice_mb = 512
slice_s = 0
wait_idle = false
rate_check = warn
