version: 1
pool_n: 4
ring_cap: 8
nodes:
  - id: prod
    type: producer
    hz: 10
    process: p1
  - id: cons
    type: consumer
    hz: 10
    process: p2
  - id: sink
    type: consumer
    hz: 10
    process: p2
    exec: event
edges:
  - from: prod
    to: cons
    channel: payload
    cpp_type: Foo
    pool: FooPool
    transport: spsc
    shm: _ob
  - from: prod
    to: sink
    channel: events
    cpp_type: Foo
    transport: spsc
    shm: _ob
processes:
  - id: p1
    role: main
  - id: p2
    role: aux
supervisor:
  shm_prefix: "/c9_%pid"
  health_n: 3
