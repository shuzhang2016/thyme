# Emit-only: depth below suggestion triggers DEPTH_WARN (M5.4).
version: 1
pool_n: 4
ring_cap: 8
nodes:
  - id: prod
    type: producer
    hz: 30
    process: p1
  - id: sink
    type: sink
    hz: 20
    process: p2
    exec: event
edges:
  - from: prod
    to: sink
    channel: readings
    cpp_type: Reading
    transport: spsc
    shm: _rd
    delivery: queue
    depth: 2
processes:
  - id: p1
    role: p1
  - id: p2
    role: p2
supervisor:
  shm_prefix: "/c9_%pid"
  health_n: 2
