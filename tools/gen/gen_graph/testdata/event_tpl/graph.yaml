version: 1
pool_n: 4
ring_cap: 8
nodes:
  - id: prod
    type: producer
    hz: 50
    process: main
  - id: sink
    type: sink
    hz: 50
    process: main
    exec: event
  - id: relay
    type: relay
    hz: 50
    process: main
    exec: event
edges:
  - from: prod
    to: sink
    channel: readings
    cpp_type: Reading
    transport: spsc
    record_priority: p0
  - from: sink
    to: relay
    channel: forwarded
    cpp_type: Reading
    transport: spsc
processes:
  - id: main
    role: main
supervisor:
  shm_prefix: "/c9_%pid"
  health_n: 3
