# Emit-only: cross-process queue edge with per-edge depth (M5.3).
version: 1
pool_n: 4
ring_cap: 8
nodes:
  - id: prod
    type: producer
    hz: 50
    process: p1
  - id: sink
    type: sink
    hz: 50
    process: p2
    exec: event
edges:
  - from: prod
    to: sink
    channel: readings
    cpp_type: Reading
    transport: spsc
    shm: _rd
    delivery: queue
    depth: 32
processes:
  - id: p1
    role: p1
  - id: p2
    role: p2
supervisor:
  shm_prefix: "/c9_%pid"
  health_n: 2
