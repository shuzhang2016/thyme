# Emit-only: same-process notify edge with per-edge depth (M5.3).
version: 1
pool_n: 4
ring_cap: 8
nodes:
  - id: prod
    type: producer
    hz: 50
  - id: sink
    type: sink
    hz: 50
    exec: event
edges:
  - from: prod
    to: sink
    channel: readings
    cpp_type: Reading
    pool: reading
    transport: spsc
    depth: 16
supervisor:
  shm_prefix: "/c9_%pid"
  health_n: 2
