version: 1
pool_n: 4
ring_cap: 8
nodes:
  - id: prod
    type: producer
    hz: 50
    process: p1
  - id: sink
    type: sink
    hz: 50
    process: p2
    exec: event
    threads: 2
edges:
  - from: prod
    to: sink
    channel: c0
    cpp_type: Reading
    transport: spsc
    shm: _c0
    delivery: queue
  - from: prod
    to: sink
    channel: c1
    cpp_type: Reading
    transport: spsc
    shm: _c1
    delivery: queue
processes:
  - id: p1
    role: p1
  - id: p2
    role: p2
supervisor:
  shm_prefix: "/c9_%pid"
  health_n: 3
